<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Commuter Departure App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23007BFF' width='180' height='180' rx='40'/><text x='50%' y='50%' font-size='80' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central'>🚍</text></svg>">
  <meta name="description" content="Small app to calculate what time you should leave to arrive on time">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#007BFF">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<button class="dark-toggle" id="themeToggle" title="Toggle dark mode">🌙</button>

<div class="container">
  <header>
    <h2>🚍 Commuter Departure Calculator</h2>
    <p class="subtitle">Never be late again! Calculate when to leave.</p>
  </header>

  <div class="card">
    <div class="form-group realtime-toggle">
      <label class="toggle-label">
        <input type="checkbox" id="realtimeToggle" checked>
        Real-time (R @ Elmhurst Av)
      </label>
    </div>

    <div id="realtimeSection" class="realtime-section">
      <div class="realtime-header">
        <h3>Real-time arrivals</h3>
        <button id="refreshArrivals" class="btn-secondary" type="button">🔄 Refresh</button>
      </div>
      <div id="realtimeStatus" class="realtime-status" role="status" aria-live="polite"></div>

      <div class="arrival-grid">
        <div class="arrival-col">
          <h4>Northbound</h4>
          <ul id="northArrivals" class="arrival-list"></ul>
        </div>
        <div class="arrival-col">
          <h4>Southbound</h4>
          <ul id="southArrivals" class="arrival-list"></ul>
        </div>
      </div>

      <div class="form-group">
        <label for="directionSelect"><span class="icon-label">🧭</span> Direction for leave-by</label>
        <select id="directionSelect">
          <option value="northbound" selected>Northbound</option>
          <option value="southbound">Southbound</option>
        </select>
      </div>

      <div class="form-group">
        <label for="walkingMinutes"><span class="icon-label">🚶</span> Walking minutes</label>
        <input type="number" id="walkingMinutes" value="7" min="0" aria-label="Walking minutes">
      </div>

      <div class="form-group">
        <label for="bufferMinutes"><span class="icon-label">⏳</span> Extra buffer (minutes)</label>
        <input type="number" id="bufferMinutes" value="3" min="0" aria-label="Buffer minutes">
      </div>

      <div id="leaveByResult" class="leaveby-result" role="status" aria-live="polite"></div>
    </div>

    <hr class="section-divider">

    <div class="form-group">
      <label for="route"><span class="icon-label">🛤️</span> Your Route</label>
      <select id="route" aria-label="Route">
        <option value="bus101">🚌 Bus 101 - Main St (Travel: 20m) | Runs: Every 15 min</option>
        <option value="bus202">🚌 Bus 202 - Downtown (Travel: 35m) | Runs: Every 20 min</option>
        <option value="trainA">🚊 Train A - Express (Travel: 25m) | Runs: Every 30 min</option>
      </select>
    </div>

    <div class="form-group">
      <label for="arrivalTime"><span class="icon-label">⏰</span> When Must You Arrive?</label>
      <input type="time" id="arrivalTime" aria-required="true">
    </div>

    <div class="form-group">
      <label for="buffer"><span class="icon-label">⏳</span> Extra Buffer (minutes)</label>
      <input type="number" id="buffer" value="10" min="0" aria-label="Buffer minutes">
    </div>

    <div class="button-group">
      <button class="btn-primary" onclick="calculateDeparture()">📍 Calculate Departure</button>
    </div>

    <button id="notifBtn" class="btn-notif" onclick="enableNotifications()" style="display: none;">🔔 Enable Notifications</button>
    <div id="notifStatus" class="notification-status"></div>

    <div id="result" role="status" aria-live="polite"></div>
    <div id="countdown"></div>
  </div>
</div>

<script>

// Dark mode toggle with localStorage persistence
function initDarkMode() {
  const toggle = document.getElementById('themeToggle');
  const savedTheme = localStorage.getItem('theme') || 'auto';
  
  function applyTheme(theme) {
    if (theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.style.colorScheme = 'dark';
      toggle.textContent = '☀️';
    } else {
      document.documentElement.style.colorScheme = 'light';
      toggle.textContent = '🌙';
    }
    localStorage.setItem('theme', theme === 'auto' ? 'auto' : theme);
  }
  
  toggle.addEventListener('click', () => {
    const current = localStorage.getItem('theme') || 'auto';
    const next = current === 'auto' ? 'light' : (current === 'light' ? 'dark' : 'auto');
    applyTheme(next);
  });
  
  applyTheme(savedTheme);
}

initDarkMode();

// Real-time MTA arrivals (R @ Elmhurst Av)
let latestArrivals = null;

function formatTime(date) {
  const hours = String(date.getHours()).padStart(2, '0');
  const minutes = String(date.getMinutes()).padStart(2, '0');
  return `${hours}:${minutes}`;
}

function setRealtimeLoading(isLoading) {
  const refreshBtn = document.getElementById('refreshArrivals');
  const status = document.getElementById('realtimeStatus');
  refreshBtn.disabled = isLoading;
  status.textContent = isLoading ? 'Loading real-time arrivals…' : '';
}

function renderArrivals(list, elementId) {
  const listEl = document.getElementById(elementId);
  if (!list || list.length === 0) {
    listEl.innerHTML = '<li class="arrival-empty">No arrivals found</li>';
    return;
  }

  listEl.innerHTML = list.map(item => {
    const arrivalTime = formatTime(new Date(item.arrivalEpoch * 1000));
    return `<li><strong>${item.minutesAway} min</strong> · ${arrivalTime}</li>`;
  }).join('');
}

function updateLeaveBy() {
  const resultEl = document.getElementById('leaveByResult');
  if (!latestArrivals) {
    resultEl.textContent = '';
    return;
  }

  const direction = document.getElementById('directionSelect').value;
  const arrivals = latestArrivals[direction] || [];
  const walking = Number(document.getElementById('walkingMinutes').value) || 0;
  const buffer = Number(document.getElementById('bufferMinutes').value) || 0;

  if (arrivals.length === 0) {
    resultEl.innerHTML = '<span class="warning">No upcoming arrivals for this direction.</span>';
    return;
  }

  const nextArrival = arrivals[0];
  const leaveByEpoch = (nextArrival.arrivalEpoch * 1000) - (walking + buffer) * 60000;
  const minutesUntilLeave = Math.round((leaveByEpoch - Date.now()) / 60000);
  const leaveByTime = formatTime(new Date(leaveByEpoch));

  if (minutesUntilLeave < 0) {
    resultEl.innerHTML = `<span class="warning">⚠️ You’re ${Math.abs(minutesUntilLeave)} min late. Leave now.</span>`;
    return;
  }

  resultEl.innerHTML = `Leave by <strong>${leaveByTime}</strong> · You have <strong>${minutesUntilLeave} min</strong>`;
}

async function fetchArrivals() {
  setRealtimeLoading(true);
  const status = document.getElementById('realtimeStatus');

  try {
    const response = await fetch('/api/mta-arrivals', { cache: 'no-store' });
    if (!response.ok) {
      throw new Error(`Server error: ${response.status}`);
    }
    const data = await response.json();
    latestArrivals = data;

    renderArrivals(data.northbound || [], 'northArrivals');
    renderArrivals(data.southbound || [], 'southArrivals');
    status.textContent = `Updated: ${new Date(data.fetchedAtISO).toLocaleTimeString()}`;
    updateLeaveBy();
  } catch (err) {
    console.error('MTA fetch error:', err);
    status.textContent = 'Could not load real-time arrivals.';
    document.getElementById('northArrivals').innerHTML = '';
    document.getElementById('southArrivals').innerHTML = '';
  } finally {
    setRealtimeLoading(false);
  }
}

function initRealtimeUI() {
  const toggle = document.getElementById('realtimeToggle');
  const section = document.getElementById('realtimeSection');
  const refreshBtn = document.getElementById('refreshArrivals');

  const updateVisibility = () => {
    section.style.display = toggle.checked ? 'block' : 'none';
  };

  toggle.addEventListener('change', updateVisibility);
  updateVisibility();

  refreshBtn.addEventListener('click', fetchArrivals);
  document.getElementById('directionSelect').addEventListener('change', updateLeaveBy);
  document.getElementById('walkingMinutes').addEventListener('input', updateLeaveBy);
  document.getElementById('bufferMinutes').addEventListener('input', updateLeaveBy);
}

// Set default arrival time to current time
function setDefaultArrivalTime() {
  const now = new Date();
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('arrivalTime').value = `${hours}:${minutes}`;
}

// Check and display notification status on page load
function updateNotificationStatus() {
  const notifBtn = document.getElementById('notifBtn');
  const notifStatus = document.getElementById('notifStatus');
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  
  if ("Notification" in window) {
    if (Notification.permission === "granted") {
      notifStatus.innerHTML = '<span class="success">✅ Notifications enabled!</span>';
      notifBtn.style.display = "none";
    } else if (Notification.permission === "denied") {
      notifStatus.innerHTML = `<span class="error">${isIOS 
        ? "⚠️ iOS PWA notifications not fully supported. Use native reminders instead." 
        : "❌ Notifications blocked. Enable in browser settings."}</span>`;
      notifBtn.style.display = isIOS ? "none" : "block";
    } else {
      notifStatus.innerHTML = '<span class="info">🔔 Tap the button below to enable notifications</span>';
      notifBtn.style.display = "block";
    }
  } else {
    notifStatus.innerHTML = '<span class="error">⚠️ Your browser doesn\'t support notifications.</span>';
    notifBtn.style.display = "none";
  }
}

// Enable notifications with user interaction
async function enableNotifications() {
  if ("Notification" in window) {
    try {
      const permission = await Notification.requestPermission();
      updateNotificationStatus();
      if (permission === "granted") {
        new Notification("✅ Notifications Ready!", {
          body: "You'll get an alert when it's time to leave.",
          tag: "notification-test"
        });
      }
    } catch (err) {
      console.error("Notification error:", err);
      document.getElementById('notifStatus').innerHTML = '<span class="error">❌ Could not enable notifications. Please try again.</span>';
    }
  }
}

// Update status on page load and when app comes to foreground
window.addEventListener('load', () => {
  setDefaultArrivalTime();
  updateNotificationStatus();
  initRealtimeUI();
  fetchArrivals();
});
window.addEventListener('focus', updateNotificationStatus);

// Main calculation function with improved error handling
async function calculateDeparture() {
  const route = document.getElementById("route").value;
  const arrivalTime = document.getElementById("arrivalTime").value;
  const buffer = parseInt(document.getElementById("buffer").value, 10);
  const resultDiv = document.getElementById("result");

  // Validate input
  if (!arrivalTime) {
    resultDiv.innerHTML = '<div class="result-container"><div class="result-text error">❌ Please enter an arrival time.</div></div>';
    return;
  }

  if (isNaN(buffer) || buffer < 0) {
    resultDiv.innerHTML = '<div class="result-container"><div class="result-text error">❌ Buffer must be a positive number.</div></div>';
    return;
  }

  // Parse arrival time to check if it's valid
  const [arrivalHours, arrivalMins] = arrivalTime.split(":").map(Number);
  const arrivalToday = new Date();
  arrivalToday.setHours(arrivalHours, arrivalMins, 0, 0);
  
  if (arrivalToday < new Date()) {
    resultDiv.innerHTML = '<div class="result-container"><div class="result-text error">❌ Arrival time has already passed today. Please enter a future time.</div></div>';
    return;
  }

  try {
    resultDiv.innerHTML = '<div class="result-container"><div class="result-text info">⏳ Calculating...</div></div>';
    
    const response = await fetch("/api/calculate-departure", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ route, arrivalTime, buffer }),
      credentials: "same-origin"
    });

    if (!response.ok) {
      const errorText = await response.text();
      console.error(`API Error ${response.status}:`, errorText);
      throw new Error(`Server error: ${response.status}`);
    }

    const data = await response.json();

    if (data.error) {
      resultDiv.innerHTML = `<div class="result-container"><div class="result-text error">❌ ${data.error}</div></div>`;
      return;
    }

    resultDiv.innerHTML = `<div class="result-container"><div class="result-text"><span class="success">✅ Leave at <strong>${data.departureTime}</strong></span><div class="info">Travel time: ${data.travelTime}m + ${buffer}m buffer = ${data.travelTime + buffer}m total</div></div></div>`;

    startCountdown(data.departureTime);
    scheduleNotification(data.departureTime);

  } catch (err) {
    console.error("API Error Details:", err.message, err.stack);
    console.error("Full Error:", err);
    const userMsg = err.message || 'Could not connect to API. Try checking if the page is still loading.';
    resultDiv.innerHTML = `<div class="result-container"><div class="result-text error">❌ ${userMsg}</div></div>`;
  }
}

function scheduleNotification(departureTime) {
  if (Notification.permission !== "granted") {
    document.getElementById("result").innerHTML += '<div class="info" style="margin-top: 8px;">💡 Enable notifications to get an alert when it\'s time to leave.</div>';
    return;
  }

  const now = new Date();
  const [hours, minutes] = departureTime.split(":").map(Number);

  const departureDate = new Date();
  departureDate.setHours(hours, minutes, 0, 0);

  // If departure time already passed today, stop
  if (departureDate <= now) {
    document.getElementById("result").innerHTML += '<div class="error" style="margin-top: 8px;">⚠️ Departure time has already passed.</div>';
    return;
  }

  const delay = departureDate - now;

  setTimeout(() => {
    new Notification("⏰ Time to Leave!", {
      body: `Leave now to arrive at ${departureTime}. Safe travels! 🚍`,
      tag: "departure-time",
      requireInteraction: true
    });
  }, delay);
}

let countdownInterval;

function startCountdown(departureTime) {
  clearInterval(countdownInterval);

  countdownInterval = setInterval(() => {
    const now = new Date();
    const [h, m] = departureTime.split(":").map(Number);

    const target = new Date();
    target.setHours(h, m, 0, 0);

    const diff = target - now;

    if (diff <= 0) {
      document.getElementById("countdown").innerHTML = '<div class="countdown-timer">🚍 Time to leave!</div>';
      clearInterval(countdownInterval);
      return;
    }

    const mins = Math.floor(diff / 60000);
    const secs = Math.floor((diff % 60000) / 1000);

    document.getElementById("countdown").innerHTML = `<div class="countdown-timer">⏳ ${mins}m ${secs}s left</div>`;
  }, 1000);
}

// Register service worker for PWA support
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then((reg) => {
    console.log('✅ Service Worker registered');
  }).catch((err) => {
    console.warn('⚠️ Service Worker registration failed:', err);
  });
}

</script>

</body>
</html>
