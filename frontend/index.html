<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Commuter Departure App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  
  <!-- PWA Icons -->
  <link rel="icon" type="image/svg+xml" sizes="192x192" href="icons/icon-192.svg">
  <link rel="icon" type="image/svg+xml" sizes="512x512" href="icons/icon-512.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.svg">
  
  <!-- PWA Meta Tags -->
  <meta name="description" content="Small app to calculate what time you should leave to arrive on time">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#007BFF">
  
  <!-- Android PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Commuter Calc">
</head>
<body>

<div class="container">
  <header>
    <h2>🚍 Commuter Departure Calculator</h2>
    <p class="subtitle">Never be late again! Calculate when to leave.</p>
    <p class="station-label">🚇 R Train · Elmhurst Av Station</p>
  </header>

  <div class="card">
    <div id="realtimeSection" class="realtime-section">
      <div class="realtime-header">
        <h3>Real-time arrivals</h3>
        <button id="refreshArrivals" class="btn-secondary" type="button">🔄 Refresh</button>
      </div>
      <div id="realtimeStatus" class="realtime-status" role="status" aria-live="polite"></div>
      <div id="dateDisplay" class="date-display"></div>

      <div class="arrival-grid">
        <div class="arrival-col">
          <h4>Uptown / Forest Hills</h4>
          <ul id="northArrivals" class="arrival-list"></ul>
        </div>
        <div class="arrival-col">
          <h4>Downtown / Manhattan</h4>
          <ul id="southArrivals" class="arrival-list"></ul>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="directionSelect"><span class="icon-label">🧭</span> Direction for leave-by</label>
          <select id="directionSelect">
            <option value="northbound" selected>Uptown / Forest Hills</option>
            <option value="southbound">Downtown / Manhattan</option>
          </select>
        </div>

        <div class="form-group">
          <label for="arrivalSelect"><span class="icon-label">🚆</span> Choose arrival</label>
          <select id="arrivalSelect" aria-label="Arrival options"></select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="walkingMinutes"><span class="icon-label">🚶</span> Walking minutes</label>
          <input type="number" id="walkingMinutes" value="7" min="0" aria-label="Walking minutes">
        </div>

        <div class="form-group">
          <label for="bufferMinutes"><span class="icon-label">⏳</span> Extra buffer (minutes)</label>
          <input type="number" id="bufferMinutes" value="3" min="0" aria-label="Buffer minutes">
        </div>
      </div>

      <div id="leaveByResult" class="leaveby-result" role="status" aria-live="polite"></div>
      <div id="countdown"></div>
    </div>
    <button id="notifBtn" class="btn-notif" onclick="enableNotifications()" style="display: none;">🔔 Enable Notifications</button>
    <div id="notifStatus" class="notification-status"></div>
  </div>
</div>

<script>

// Create alarm audio for notifications
let audioContext = null;
let alarmInterval = null;
let audioInitialized = false;

// Initialize audio on first user interaction
function initAudio() {
  if (audioInitialized) return;
  try {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    audioInitialized = true;
    console.log('✅ Audio initialized');
  } catch (e) {
    console.warn('Could not initialize audio:', e);
  }
}

// Initialize audio on any user interaction
document.addEventListener('click', initAudio, { once: true });
document.addEventListener('touchstart', initAudio, { once: true });

function playBeep() {
  if (!audioContext) {
    initAudio();
    if (!audioContext) return;
  }
  
  try {
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    
    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);
    
    oscillator.type = 'sine';
    oscillator.frequency.value = 880; // A5 note
    
    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
    
    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + 0.3);
  } catch (e) {
    console.warn('Beep error:', e);
  }
}

function playAlarm() {
  stopAlarm();
  
  console.log('🔊 Playing alarm for 10 seconds');
  
  // Play beep immediately
  playBeep();
  
  // Then beep every 0.6 seconds for 10 seconds
  let count = 0;
  const maxBeeps = 16; // ~10 seconds (16 * 0.6s)
  
  alarmInterval = setInterval(() => {
    count++;
    if (count >= maxBeeps) {
      stopAlarm();
      return;
    }
    playBeep();
  }, 600);
}

function stopAlarm() {
  if (alarmInterval) {
    clearInterval(alarmInterval);
    alarmInterval = null;
    console.log('🔇 Alarm stopped');
  }
}

// Real-time MTA arrivals (R @ Elmhurst Av)
let latestArrivals = null;

function formatTime(date) {
  const hours = String(date.getHours()).padStart(2, '0');
  const minutes = String(date.getMinutes()).padStart(2, '0');
  return `${hours}:${minutes}`;
}

function setRealtimeLoading(isLoading) {
  const refreshBtn = document.getElementById('refreshArrivals');
  const status = document.getElementById('realtimeStatus');
  refreshBtn.disabled = isLoading;
  status.textContent = isLoading ? 'Loading real-time arrivals…' : '';
}

function getFilteredArrivals(direction) {
  const arrivals = (latestArrivals && latestArrivals[direction]) || [];
  const walking = Number(document.getElementById('walkingMinutes').value) || 0;
  const buffer = Number(document.getElementById('bufferMinutes').value) || 0;
  const minLead = walking + buffer;

  console.log(`[getFilteredArrivals] direction=${direction}, raw arrivals=${arrivals.length}, minLead=${minLead}`);

  const filtered = arrivals.filter(item => item.minutesAway >= minLead);
  console.log(`[getFilteredArrivals] filtered arrivals=${filtered.length}`);
  return filtered.slice(0, 2);
}

function renderArrivals(list, elementId) {
  const listEl = document.getElementById(elementId);
  if (!list || list.length === 0) {
    listEl.innerHTML = '<li class="arrival-empty">No arrivals far enough for your walk + buffer</li>';
    return;
  }

  listEl.innerHTML = list.map(item => {
    const arrivalTime = formatTime(new Date(item.arrivalEpoch * 1000));
    return `<li><strong>${item.minutesAway} min</strong> · ${arrivalTime}</li>`;
  }).join('');
}

function updateLeaveBy() {
  const resultEl = document.getElementById('leaveByResult');
  resetCountdown();
  if (notificationTimeout) {
    clearTimeout(notificationTimeout);
  }
  if (!latestArrivals) {
    resultEl.textContent = '';
    return;
  }

  const direction = document.getElementById('directionSelect').value;
  const arrivals = getFilteredArrivals(direction);
  const walking = Number(document.getElementById('walkingMinutes').value) || 0;
  const buffer = Number(document.getElementById('bufferMinutes').value) || 0;
  const arrivalSelect = document.getElementById('arrivalSelect');

  if (!arrivals.length) {
    resultEl.innerHTML = '<span class="warning">No arrivals far enough for your walk + buffer.</span>';
    document.getElementById('countdown').innerHTML = '';
    return;
  }

  const selectedEpoch = Number(arrivalSelect.value);
  const selectedArrival = arrivals.find(item => item.arrivalEpoch === selectedEpoch) || arrivals[0];
  const leaveByEpoch = (selectedArrival.arrivalEpoch * 1000) - (walking + buffer) * 60000;
  const minutesUntilLeave = Math.round((leaveByEpoch - Date.now()) / 60000);
  const leaveByTime = formatTime(new Date(leaveByEpoch));

  if (minutesUntilLeave < 0) {
    resultEl.innerHTML = `<span class="warning">⚠️ You’re ${Math.abs(minutesUntilLeave)} min late. Leave now.</span>`;
    return;
  }

  resultEl.innerHTML = `Leave by <strong>${leaveByTime}</strong> · You have <strong>${minutesUntilLeave} min</strong>`;
  startCountdown(leaveByEpoch);
  scheduleNotification(leaveByEpoch);
}

async function fetchArrivals() {
  setRealtimeLoading(true);
  const status = document.getElementById('realtimeStatus');
  const dateDisplay = document.getElementById('dateDisplay');

  try {
    const response = await fetch('/api/mta-arrivals', { cache: 'no-store' });
    if (!response.ok) {
      throw new Error(`Server error: ${response.status}`);
    }
    const data = await response.json();
    latestArrivals = data;

    renderArrivals(getFilteredArrivals('northbound'), 'northArrivals');
    renderArrivals(getFilteredArrivals('southbound'), 'southArrivals');
    updateArrivalOptions();
    
    const fetchedDate = new Date(data.fetchedAtISO);
    status.textContent = `Updated: ${fetchedDate.toLocaleTimeString()}`;
    dateDisplay.textContent = `📅 ${fetchedDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}`;
    
    updateLeaveBy();
  } catch (err) {
    console.error('MTA fetch error:', err);
    status.textContent = 'Could not load real-time arrivals.';
    document.getElementById('northArrivals').innerHTML = '';
    document.getElementById('southArrivals').innerHTML = '';
  } finally {
    setRealtimeLoading(false);
  }
}

function updateArrivalOptions() {
  const select = document.getElementById('arrivalSelect');
  const direction = document.getElementById('directionSelect').value;
  const arrivals = getFilteredArrivals(direction);

  console.log(`[updateArrivalOptions] direction=${direction}, arrivals count=${arrivals.length}`);

  if (!arrivals.length) {
    select.innerHTML = '<option value="">No arrivals available</option>';
    select.selectedIndex = 0;
    return;
  }

  select.innerHTML = arrivals.map((item, index) => {
    const timeLabel = formatTime(new Date(item.arrivalEpoch * 1000));
    return `<option value="${item.arrivalEpoch}">in ${item.minutesAway} min · ${timeLabel}</option>`;
  }).join('');

  select.selectedIndex = 0;
}

function maybeAutoRefresh() {
  if (!latestArrivals) return fetchArrivals();
  const arrivalSelect = document.getElementById('arrivalSelect');
  const selectedEpoch = Number(arrivalSelect.value);

  if (!selectedEpoch) {
    fetchArrivals();
    return;
  }

  const selectedMs = selectedEpoch * 1000;
  const minutesAway = Math.round((selectedMs - Date.now()) / 60000);
  if (minutesAway <= 0) {
    fetchArrivals();
  }
}

function initRealtimeUI() {
  const refreshBtn = document.getElementById('refreshArrivals');

  refreshBtn.addEventListener('click', fetchArrivals);
  document.getElementById('directionSelect').addEventListener('change', () => {
    setRealtimeLoading(false);
    document.getElementById('realtimeStatus').textContent = '';
    resetCountdown();
    updateArrivalOptions();
    updateLeaveBy();
  });
  document.getElementById('arrivalSelect').addEventListener('change', () => {
    resetCountdown();
    updateLeaveBy();
  });
  document.getElementById('walkingMinutes').addEventListener('input', () => {
    setRealtimeLoading(false);
    resetCountdown();
    updateArrivalOptions();
    updateLeaveBy();
  });
  document.getElementById('bufferMinutes').addEventListener('input', () => {
    setRealtimeLoading(false);
    resetCountdown();
    updateArrivalOptions();
    updateLeaveBy();
  });
}

// Check and display notification status on page load
function updateNotificationStatus() {
  const notifBtn = document.getElementById('notifBtn');
  const notifStatus = document.getElementById('notifStatus');
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  
  if ("Notification" in window) {
    if (Notification.permission === "granted") {
      notifStatus.innerHTML = '<span class="success">✅ Notifications enabled!</span>';
      notifBtn.style.display = "none";
    } else if (Notification.permission === "denied") {
      notifStatus.innerHTML = `<span class="error">${isIOS 
        ? "⚠️ iOS PWA notifications not fully supported. Use native reminders instead." 
        : "❌ Notifications blocked. Enable in browser settings."}</span>`;
      notifBtn.style.display = isIOS ? "none" : "block";
    } else {
      notifStatus.innerHTML = '<span class="info">🔔 Tap the button below to enable notifications</span>';
      notifBtn.style.display = "block";
    }
  } else {
    notifStatus.innerHTML = '<span class="error">⚠️ Your browser doesn\'t support notifications.</span>';
    notifBtn.style.display = "none";
  }
}

// Enable notifications with user interaction
async function enableNotifications() {
  if ("Notification" in window) {
    try {
      const permission = await Notification.requestPermission();
      updateNotificationStatus();
      if (permission === "granted") {
        new Notification("✅ Notifications Ready!", {
          body: "You'll get an alert when it's time to leave.",
          tag: "notification-test"
        });
      }
    } catch (err) {
      console.error("Notification error:", err);
      document.getElementById('notifStatus').innerHTML = '<span class="error">❌ Could not enable notifications. Please try again.</span>';
    }
  }
}

// Update status on page load and when app comes to foreground
window.addEventListener('load', () => {
  updateNotificationStatus();
  initRealtimeUI();
  fetchArrivals();
  setInterval(maybeAutoRefresh, 20000);
});
window.addEventListener('focus', updateNotificationStatus);

let notificationTimeout;
function scheduleNotification(leaveByEpochMs) {
  if (Notification.permission !== "granted") {
    return;
  }

  if (notificationTimeout) {
    clearTimeout(notificationTimeout);
  }

  const now = Date.now();
  if (leaveByEpochMs <= now) {
    return;
  }

  const delay = leaveByEpochMs - now;
  const leaveByTime = formatTime(new Date(leaveByEpochMs));

  notificationTimeout = setTimeout(() => {
    new Notification("⏰ Time to Leave!", {
      body: `Leave now to catch the ${leaveByTime} train.`,
      tag: "departure-time",
      requireInteraction: true
    });
    // Play alarm sound for 10 seconds
    playAlarm();
  }, delay);
}

let countdownInterval;
function resetCountdown() {
  if (countdownInterval) {
    clearInterval(countdownInterval);
  }
  document.getElementById('countdown').innerHTML = '';
}

function startCountdown(leaveByEpochMs) {
  clearInterval(countdownInterval);

  countdownInterval = setInterval(() => {
    const diff = leaveByEpochMs - Date.now();

    if (diff <= 0) {
      document.getElementById("countdown").innerHTML = '<div class="countdown-timer">🚍 Time to leave!</div>';
      clearInterval(countdownInterval);
      return;
    }

    const mins = Math.floor(diff / 60000);
    const secs = Math.floor((diff % 60000) / 1000);

    document.getElementById("countdown").innerHTML = `<div class="countdown-timer">⏳ ${mins}m ${secs}s left</div>`;
  }, 1000);
}

// Register service worker for PWA support
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then((reg) => {
    console.log('✅ Service Worker registered');
  }).catch((err) => {
    console.warn('⚠️ Service Worker registration failed:', err);
  });
}

</script>

</body>
</html>
